name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Instalar deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Contract test
        run: bun run test:contrato

      - name: Build (export estática + SW versionado)
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /digielect-digitalizador

      - name: Golden tests del motor (Playwright)
        run: |
          bunx playwright install --with-deps chromium
          # Emula el layout de GitHub Pages: el sitio del proyecto se monta
          # bajo /digielect-digitalizador/ y el export sale plano.
          mkdir -p site/digielect-digitalizador
          cp -r out/* site/digielect-digitalizador/
          bunx serve -l 4173 site --no-clipboard > /dev/null 2>&1 &
          sleep 3
          GOLDEN_BASE_URL=http://localhost:4173/digielect-digitalizador \
            bunx playwright test tests/motor.spec.mjs --reporter=line

      - name: Golden OCR — modo medición (sin GOLDEN_STRICT; tabla en el log)
        run: |
          # MEDICIÓN: corre el harness OCR real (T0) sobre el export ya servido.
          # Sin GOLDEN_STRICT=1 → NO gatea el CI; imprime la tabla pass-rate
          # por campo en el log del run para comparar vs baseline (67.5%).
          # Los casos sin JPG en public/actas se saltan solos (corpus Kit 399
          # pendiente); las 8 actas del repo SÍ corren.
          # Puerto 4174: el servidor 4173 del paso anterior sigue vivo en el job.
          mkdir -p site/digielect-digitalizador
          cp -r out/* site/digielect-digitalizador/
          bunx serve -l 4174 site --no-clipboard > /dev/null 2>&1 &
          sleep 3
          GOLDEN_BASE_URL=http://localhost:4174/digielect-digitalizador \
            bunx playwright test tests/ocr-golden.spec.mjs --reporter=list
